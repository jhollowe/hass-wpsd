---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run all pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies
        # The integration's own requirements come from manifest.json
        run: |
          uv venv
          uv pip install --group dev "beautifulsoup4>=4.13.3"
      - name: Run tests
        run: uv run --no-sync python -m pytest --cov --cov-report=term-missing --cov-fail-under=95
