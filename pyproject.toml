[project]
name = "hass-wpsd"
version = "0.0.0"
description = "Home Assistant integration for WPSD digital radio hotspot software"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[tool.setuptools.packages.find]
include = ["custom_components/wpsd*"]

[dependency-groups]
dev = [
    "homeassistant",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
